name = "gitcert"
main = "src/index.ts"
compatibility_date = "2026-07-22"
routes = [{ pattern = "gitcert.harborstack.app/*", zone_name = "harborstack.app" }]

[[d1_databases]]
binding = "DB"
database_name = "gitcert"
database_id = "54400dbb-a6b7-437f-bdad-3efb4f52d352"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

# Compiled page stylesheet (npm run build:css → public/styles.css).
[assets]
directory = "public"

[vars]
GITHUB_APP_ID = "4372262"
# GitHub App OAuth client id — public (not a secret); the client secret and
# SESSION_SECRET are set via `wrangler secret put` (see deploy notes).
GITHUB_CLIENT_ID = "Iv23li5arGyR24Lerrba"
